<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOCform 2.4</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="top-grid">
      <div class="editor-pane" id="dropZone">
        <div class="pane-head">
          <div>
            <h1>LOCform 2.4</h1>
            <span>Web, Mobile, Redesign</span>
          </div>
          <button id="convertBtn" type="button">Преобразовать</button>
        </div>

        <div class="textarea-wrap">
          <textarea id="sourceText" spellcheck="false" placeholder="Вставьте текст CRM/промо или перетащите сюда .docx/.txt/.html файл"></textarea>
          <div class="drop-hint">Отпустите .docx, .txt или .html файл здесь</div>
        </div>

        <div class="options">
          <label><input id="autoConvert" type="checkbox" checked> Автообновление</label>
          <label><input id="keepLists" type="checkbox" checked> Собирать списки</label>
          <label><input id="keepTables" type="checkbox" checked> Собирать таблицы</label>
        </div>
      </div>

      <div class="results-pane">
        <div class="key-bar">
          <div class="key-tabs" id="keyTabs" aria-label="Ключи">
            <span class="key-empty">Ключи появятся после преобразования</span>
          </div>
          <button id="copyKeyBtn" class="key-copy" type="button" disabled>Скопировать ключ</button>
        </div>

        <div class="tabs" role="tablist" aria-label="Версии HTML">
          <button class="tab active" type="button" data-tab="topic">Topic</button>
          <button class="tab" type="button" data-tab="compact">Web</button>
          <button class="tab" type="button" data-tab="mobile">Mobile</button>
          <button class="tab" type="button" data-tab="pc">Redesign</button>
        </div>

        <section class="result active" data-panel="topic">
          <div class="result-head">
            <h2>Topic</h2>
            <div class="result-actions">
              <button id="copyTopicKeyBtn" class="topic-key-copy" type="button" disabled>Скопировать ключ</button>
              <button type="button" data-copy="topic">Копировать</button>
            </div>
          </div>
          <textarea id="topicOutput" spellcheck="false"></textarea>
        </section>

        <section class="result" data-panel="compact">
          <div class="result-head">
            <h2>Web</h2>
            <button type="button" data-copy="compact">Копировать</button>
          </div>
          <textarea id="compactOutput" spellcheck="false"></textarea>
        </section>

        <section class="result" data-panel="mobile">
          <div class="result-head">
            <h2>Mobile</h2>
            <button type="button" data-copy="mobile">Копировать</button>
          </div>
          <textarea id="mobileOutput" spellcheck="false"></textarea>
        </section>

        <section class="result" data-panel="pc">
          <div class="result-head">
            <h2>Redesign</h2>
            <button type="button" data-copy="pc">Копировать</button>
          </div>
          <textarea id="pcOutput" spellcheck="false"></textarea>
        </section>
      </div>
    </section>

    <section class="preview-band">
      <h2>Предпросмотр активной версии</h2>
      <div id="preview"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
